# CI budgets per tier (METHODOLOGY "CI Tier Definitions").
# Budgets are in wall-clock seconds per event (total_cost_s = transpilation + oracle).
# CALIBRATED + FROZEN 2026-08-07 as the PRE-DECLARED fractions (corpus_costhet.yaml: pr 5%, nightly 50%)
# of the measured full-suite cost of the frozen cost-heterogeneous corpus: T_full = 69.17 s over 116 units
# (Intel Xeon @2.20GHz, 1 logical CPU, qiskit 2.4.2, RAYON_NUM_THREADS=1). Costs only — set before evaluate.

tiers:
  pr:
    budget_s: 3.46       # 5% of T_full=69.17s -> binds: fits 91/116 units, excludes 25/29 costliest
    exploration_reserve_frac: 0.20   # METHODOLOGY §4.2: 10-20% stage-independent
  nightly:
    budget_s: 34.59      # 50% of T_full=69.17s -> binds: fits 110/116, excludes 6/29 costliest
    exploration_reserve_frac: 0.15
  release:
    budget_s: null       # full suite (no cap) = 100% of T_full
    exploration_reserve_frac: 0.10

# Small positive floor so stage-mismatch alone never zeroes a test (METHODOLOGY §4.1).
risk_score_epsilon: 0.05
